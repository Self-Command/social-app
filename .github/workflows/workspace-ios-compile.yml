name: Workspace iOS Compile

# 仅用于企业分支的原生编译验证：无签名、不产出可分发 IPA、不上传商店。
# workflow_dispatch 只识别默认分支上的工作流；企业分支通过标签推送触发，
# 标签格式：ios-compile-<时间戳>。
on:
  push:
    tags:
      - 'ios-compile-*'

concurrency:
  group: workspace-ios-compile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compile:
    name: iOS unsigned compile
    # Xcode 26 ships Swift 6.2; React Native 0.88's SwiftPM dependency requires
    # Swift tools 6.2, which the macos-15 image (Swift 6.1) cannot resolve.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Show toolchain versions
        run: |
          set -euo pipefail
          xcodebuild -version
          pod --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      # 本地化 messages.ts 不入库，CI 环境下 postinstall 的 intl:compile-if-needed 会跳过编译，必须显式生成。
      - name: Compile localization messages
        run: pnpm intl:compile
      - name: Generate iOS project
        run: |
          set -euo pipefail
          export CI=1
          export EXPO_NO_GIT_STATUS=1
          export EXPO_NO_TELEMETRY=1
          export EXPO_PUBLIC_ENV=production
          export DISABLE_UPDATES=1
          npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          cd ios
          pod install
      - name: Compile unsigned device build
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)"
          if [[ -z "${WORKSPACE}" ]]; then
            echo "::error::expo prebuild 未生成 iOS workspace。"
            exit 1
          fi
          SCHEME="$(basename "${WORKSPACE}" .xcworkspace)"
          echo "workspace=${WORKSPACE}"
          echo "scheme=${SCHEME}"
          set +e
          xcodebuild \
            -workspace "${WORKSPACE}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "${status}" -ne 0 ]]; then
            echo "::error::xcodebuild 编译失败，退出码 ${status}。"
            tail -n 200 xcodebuild.log
            exit "${status}"
          fi
      - name: Verify compiled app bundle
        run: |
          set -euo pipefail
          APP="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          if [[ -z "${APP}" ]]; then
            echo "::error::编译成功但未找到 .app 产物。"
            exit 1
          fi
          echo "app=${APP}"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP}/Info.plist"
          du -sh "${APP}"
      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-compile-log-${{ github.run_id }}
          path: xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
