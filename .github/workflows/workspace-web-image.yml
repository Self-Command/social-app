name: Workspace Web Image

on:
  push:
    branches:
      - workspace/dev
  workflow_dispatch:

concurrency:
  group: workspace-web-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Scan changed files
        run: bash .github/scripts/workspace-secret-scan.sh "${{ github.event.before }}"

  build:
    name: Build social-app-web
    needs: secret-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute image namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log into GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push commit image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            EXPO_PUBLIC_ENV=development
            EXPO_PUBLIC_RELEASE_VERSION=${{ github.sha }}
            EXPO_PUBLIC_BUNDLE_IDENTIFIER=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/social-app-web:${{ github.sha }}
            ghcr.io/${{ steps.ns.outputs.owner }}/social-app-web:dev
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=social-app-web
          cache-to: type=gha,mode=max,scope=social-app-web
