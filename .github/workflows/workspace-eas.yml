name: Workspace EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options:
          - development
          - preview
        default: development

concurrency:
  group: workspace-eas-${{ github.workflow }}-${{ inputs.profile }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: EAS ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: '25.3.0'
          packager: 'pnpm --dangerously-allow-all-builds'
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify Expo account
        run: eas whoami
      - name: Submit build
        run: eas build --profile "${{ inputs.profile }}" --platform all --non-interactive --no-wait
      - name: Record build links
        run: |
          set -euo pipefail
          eas build:list --profile "${{ inputs.profile }}" --limit 2 --non-interactive --json > eas-builds.json
          {
            echo "### EAS build submitted"
            echo
            echo "Profile: \`${{ inputs.profile }}\`"
            echo "Commit: \`${{ github.sha }}\`"
            echo
            node -e '
              const builds = require("./eas-builds.json");
              for (const b of builds) {
                console.log(`- ${b.platform}: ${b.buildDetailsPageUrl ?? b.artifacts?.buildUrl ?? "(pending)"}`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"
