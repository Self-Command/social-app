name: Workspace Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        type: choice
        options:
          - development
          - e2e
        default: development
  # workflow_dispatch 只识别默认分支上的工作流；企业分支通过标签推送触发，
  # 避免把企业流程写进上游 main。标签格式：android-apk-<时间戳>（development）
  # 或 android-apk-e2e-<时间戳>（e2e）。
  push:
    tags:
      - 'android-apk-*'

concurrency:
  group: workspace-android-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve build profile
        id: profile
        env:
          INPUT_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          profile="${INPUT_PROFILE}"
          if [[ -z "${profile}" ]]; then
            case "${GITHUB_REF_NAME}" in
              android-apk-e2e-*) profile=e2e ;;
              android-apk-*) profile=development ;;
              *) echo "::error::无法从 ${GITHUB_REF_NAME} 推断构建配置。"; exit 1 ;;
            esac
          fi
          case "${profile}" in
            development|e2e) ;;
            *) echo "::error::不支持的构建配置：${profile}"; exit 1 ;;
          esac
          echo "profile=${profile}" >> "${GITHUB_OUTPUT}"
          echo "构建配置：${profile}"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      # 本地化 messages.ts 不入库，CI 环境下 postinstall 的 intl:compile-if-needed 会跳过编译，必须显式生成。
      - name: Compile localization messages
        run: pnpm intl:compile
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${SDK}" || ! -d "${SDK}" ]]; then
            echo "::error::运行器未提供 Android SDK。"
            exit 1
          fi
          SDKM="$(find "${SDK}/cmdline-tools" -mindepth 2 -maxdepth 3 -name sdkmanager | sort -V | tail -1)"
          if [[ -z "${SDKM}" ]]; then
            echo "::error::未找到 sdkmanager。"
            exit 1
          fi
          yes | "${SDKM}" --licenses > /dev/null 2>&1 || true
          "${SDKM}" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Generate Android project
        run: |
          set -euo pipefail
          export CI=1
          export EXPO_NO_GIT_STATUS=1
          export EXPO_NO_TELEMETRY=1
          if [[ "${{ steps.profile.outputs.profile }}" == "e2e" ]]; then
            export EXPO_PUBLIC_ENV=e2e
            export NODE_ENV=development
            export RN_SRC_EXT=e2e.ts,e2e.tsx
          else
            export EXPO_PUBLIC_ENV=production
            export DISABLE_UPDATES=1
          fi
          npx expo prebuild --platform android --no-install
      - name: Build release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [[ -z "${APK}" ]]; then
            echo "::error::Gradle 未生成 release APK。"
            exit 1
          fi
          cp "${APK}" app.apk
          ls -lh app.apk
      - name: Verify package name
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${SDK}" || ! -d "${SDK}/build-tools" ]]; then
            echo "::error::运行器缺少 Android SDK build-tools，无法校验包名。"
            exit 1
          fi
          AAPT2="$(find "${SDK}/build-tools" -mindepth 2 -maxdepth 2 -name aapt2 | sort -V | tail -1)"
          if [[ -z "${AAPT2}" ]]; then
            echo "::error::未找到 aapt2，无法校验包名。"
            exit 1
          fi
          BADGING="$("${AAPT2}" dump badging app.apk | head -1)"
          echo "${BADGING}"
          if [[ "${BADGING}" != *"package: name='xyz.blueskyweb.app'"* ]]; then
            echo "::error::构建产物包名不是 xyz.blueskyweb.app，已拒绝上传。"
            exit 1
          fi
      - name: Compute artifact name
        id: meta
        run: echo "name=app-android-${{ steps.profile.outputs.profile }}-${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"
      - name: Upload Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.meta.outputs.name }}
          path: app.apk
          if-no-files-found: error
          retention-days: 14
